<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game of Cece</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 1rem;
      box-sizing: border-box;
      text-align: center;
      background: linear-gradient(160deg, #ffb3d9, #b3c6ff);
      color: #2b1a4a;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 12vw, 5rem);
    }
    p {
      margin: 0;
      font-size: 1.2rem;
    }
    button {
      font-size: 1.3rem;
      padding: 0.8rem 1.6rem;
      border: none;
      border-radius: 999px;
      background: #7b3fe4;
      color: #fff;
      cursor: pointer;
    }
    button:active { transform: scale(0.95); }
    #count { font-size: 1.5rem; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Hello Cece! 👋</h1>
  <p>Hier entsteht dein eigenes Spiel.</p>
  <button id="btn">Tipp mich!</button>
  <div id="count">0</div>
  <script>
    let n = 0;
    const count = document.getElementById("count");
    document.getElementById("btn").addEventListener("click", () => {
      n++;
      count.textContent = n;
    });
  </script>
</body>
</html>
